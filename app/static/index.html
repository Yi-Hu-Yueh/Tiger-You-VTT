<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiger-You-VTT</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #17202a; }
    main { max-width: 850px; margin: 2rem auto; padding: 1.5rem; background: white; border-radius: 12px; box-shadow: 0 8px 30px #17202a18; }
    h1 { margin-top: 0; }
    fieldset { border: 1px solid #ccd3da; border-radius: 8px; margin-bottom: 1rem; }
    .source { display: grid; gap: .75rem; margin: 1rem 0; }
    input[type="url"], input[type="file"], input[type="text"], textarea { box-sizing: border-box; width: 100%; }
    input[type="url"], input[type="file"], input[type="text"] { padding: .65rem; }
    .range { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .range label { display: grid; gap: .35rem; }
    textarea { min-height: 260px; padding: .8rem; resize: vertical; }
    button { border: 0; border-radius: 7px; padding: .7rem 1rem; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #startButton { background: #1668dc; color: white; }
    #stopButton { background: #c62828; color: white; }
    .controls, .downloads { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; }
    .status { padding: .75rem; background: #eef3f8; border-radius: 7px; }
    .note { color: #52606d; font-size: .92rem; }
  </style>
</head>
<body>
<main>
  <h1>Tiger-You-VTT 字幕工具</h1>
  <fieldset>
    <legend>來源</legend>
    <label><input type="radio" name="mode" value="youtube" checked> YouTube 網址</label>
    <label><input type="radio" name="mode" value="upload"> 上傳影片</label>
    <label><input type="radio" name="mode" value="audio"> 上傳語音檔</label>
    <label><input type="radio" name="mode" value="system_audio"> 電腦播放聲音</label>
    <div class="source">
      <input id="youtubeUrl" type="url" placeholder="https://www.youtube.com/watch?v=...">
      <input id="videoFile" type="file" accept="video/*" hidden>
      <input id="audioFile" type="file" accept=".mp3,.wav,.m4a,.aac,.flac,.ogg,.opus,.wma,audio/*" hidden>
      <div id="systemAudioControls" hidden>
        <label>音訊輸出裝置:
          <select id="systemAudioDevice"></select>
        </label>
        <button id="refreshSystemAudioDevices" type="button">重新整理裝置</button>
      </div>
    </div>
  </fieldset>

  <fieldset id="rangeControls">
    <legend>擷取區間</legend>
    <div class="range">
      <label>擷取開始時間: 小時:分鐘
        <input id="startTime" type="text" inputmode="numeric" value="0:0">
      </label>
      <label>擷取結束時間: 小時:分鐘
        <input id="endTime" type="text" inputmode="numeric" value="0:10">
      </label>
    </div>
    <p class="note">擷取開始時間留空 = 從頭開始<br>擷取結束時間留空 = 到影片結束<br>兩者都留空 = 擷取全部</p>
  </fieldset>

  <div class="controls">
    <button id="startButton" type="button">開始取得字幕</button>
    <button id="stopButton" type="button" disabled>停止</button>
  </div>
  <p class="note">停止會在目前安全的字幕片段完成後生效。工作與結果只會保留到目前伺服器程序結束為止。</p>

  <div class="status">
    狀態：<strong id="statusText">尚未開始</strong>
    ／ 字幕片段：<strong id="segmentCount">0</strong>
    ／ 執行所耗時間：<strong id="elapsedTime">00:00:00</strong>
  </div>
  <p id="message" aria-live="polite"></p>
  <textarea id="transcriptText" readonly placeholder="取得的字幕會顯示在這裡"></textarea>

  <div class="downloads">
    <button type="button" data-format="txt" disabled>下載 TXT</button>
    <button type="button" data-format="vtt" disabled>下載 VTT</button>
    <button type="button" data-format="srt" disabled>下載 SRT</button>
  </div>
</main>

<script>
  const terminalStates = new Set(["completed", "stopped", "failed"]);
  const DEFAULT_END_TIME = "0:10";
  let activeJobId = null;
  let latestJob = null;
  let pollTimer = null;
  let endTimeEdited = false;

  const startButton = document.querySelector("#startButton");
  const stopButton = document.querySelector("#stopButton");
  const statusText = document.querySelector("#statusText");
  const segmentCount = document.querySelector("#segmentCount");
  const elapsedTime = document.querySelector("#elapsedTime");
  const transcriptText = document.querySelector("#transcriptText");
  const message = document.querySelector("#message");
  const youtubeUrl = document.querySelector("#youtubeUrl");
  const videoFile = document.querySelector("#videoFile");
  const audioFile = document.querySelector("#audioFile");
  const systemAudioControls = document.querySelector("#systemAudioControls");
  const systemAudioDevice = document.querySelector("#systemAudioDevice");
  const refreshSystemAudioDevices = document.querySelector("#refreshSystemAudioDevices");
  const rangeControls = document.querySelector("#rangeControls");
  const startTime = document.querySelector("#startTime");
  const endTime = document.querySelector("#endTime");
  const downloadButtons = document.querySelectorAll("[data-format]");

  endTime.addEventListener("input", () => {
    endTimeEdited = true;
  });

  async function loadSystemAudioDevices() {
    systemAudioDevice.replaceChildren();
    const response = await fetch("/api/system-audio/devices");
    const payload = await response.json();
    if (!response.ok) {
      message.textContent = payload.detail?.message || "無法取得音訊輸出裝置";
      return;
    }
    payload.devices.forEach((device) => {
      const option = document.createElement("option");
      option.value = String(device.id);
      option.textContent = device.name;
      option.selected = device.is_default;
      systemAudioDevice.append(option);
    });
    if (!payload.devices.length) {
      message.textContent = "找不到可用的 WASAPI Loopback 音訊輸出裝置";
    }
  }

  refreshSystemAudioDevices.addEventListener("click", loadSystemAudioDevices);

  document.querySelectorAll('input[name="mode"]').forEach((radio) => {
    radio.addEventListener("change", () => {
      if (!radio.checked) return;
      const upload = radio.value === "upload";
      const audio = radio.value === "audio";
      const systemAudio = radio.value === "system_audio";
      videoFile.hidden = !upload;
      audioFile.hidden = !audio;
      systemAudioControls.hidden = !systemAudio;
      youtubeUrl.hidden = upload || audio || systemAudio;
      rangeControls.hidden = systemAudio;
      startTime.disabled = systemAudio;
      endTime.disabled = systemAudio;
      if (systemAudio) loadSystemAudioDevices();
    });
  });

  function formatElapsedTime(seconds) {
    const totalSeconds = Math.max(0, Math.floor(Number(seconds) || 0));
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const remainingSeconds = totalSeconds % 60;
    return [hours, minutes, remainingSeconds]
      .map((value) => String(value).padStart(2, "0"))
      .join(":");
  }

  function updateDisplay(job) {
    latestJob = job;
    statusText.textContent = job.status;
    segmentCount.textContent = job.segment_count;
    elapsedTime.textContent = formatElapsedTime(job.elapsed_seconds);
    transcriptText.value = job.txt;
    const active = ["queued", "running", "stopping"].includes(job.status);
    stopButton.disabled = !active;
    startButton.disabled = active;
    downloadButtons.forEach((button) => {
      button.disabled = !terminalStates.has(job.status);
    });
    if (job.status === "stopped") {
      message.textContent = "已停止，已保留目前取得的字幕";
    } else if (job.status === "failed") {
      const detail = job.error ? `${job.error.code}: ${job.error.message}` : "背景工作失敗";
      message.textContent = detail;
    } else if (job.status === "completed") {
      message.textContent = "字幕處理完成";
    }
  }

  async function pollJob() {
    if (!activeJobId) return;
    const response = await fetch(`/api/jobs/${activeJobId}`);
    const job = await response.json();
    updateDisplay(job);
    if (!terminalStates.has(job.status)) {
      pollTimer = setTimeout(pollJob, 1000);
    }
  }

  startButton.addEventListener("click", async () => {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    let response;
    message.textContent = "";
    transcriptText.value = "";
    segmentCount.textContent = "0";
    elapsedTime.textContent = "00:00:00";
    const endTimeIsDefault = !endTimeEdited && endTime.value === DEFAULT_END_TIME;
    if (mode === "system_audio") {
      if (!systemAudioDevice.value) {
        message.textContent = "請選擇音訊輸出裝置";
        return;
      }
      response = await fetch("/api/jobs/system-audio", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device_id: Number(systemAudioDevice.value) })
      });
    } else if (mode === "upload" || mode === "audio") {
      const selectedFile = mode === "audio" ? audioFile : videoFile;
      if (!selectedFile.files.length) {
        message.textContent = mode === "audio" ? "請選擇語音檔案" : "請選擇影片檔案";
        return;
      }
      const body = new FormData();
      body.append("file", selectedFile.files[0]);
      body.append("start_time", startTime.value);
      body.append("end_time", endTime.value);
      body.append("end_time_is_default", String(endTimeIsDefault));
      const endpoint = mode === "audio" ? "/api/jobs/audio" : "/api/jobs/video";
      response = await fetch(endpoint, { method: "POST", body });
    } else {
      response = await fetch("/api/jobs/youtube", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          url: youtubeUrl.value,
          start_time: startTime.value,
          end_time: endTime.value,
          end_time_is_default: endTimeIsDefault
        })
      });
    }
    const payload = await response.json();
    if (!response.ok) {
      message.textContent = payload.detail?.message || "無法建立工作";
      return;
    }
    activeJobId = payload.job_id;
    updateDisplay({ ...payload, segment_count: 0, txt: "", elapsed_seconds: 0 });
    clearTimeout(pollTimer);
    pollJob();
  });

  stopButton.addEventListener("click", async () => {
    if (!activeJobId) return;
    stopButton.disabled = true;
    stopButton.textContent = "停止中...";
    statusText.textContent = "stopping";
    const response = await fetch(`/api/jobs/${activeJobId}/stop`, { method: "POST" });
    const job = await response.json();
    updateDisplay(job);
    stopButton.textContent = "停止";
    if (!terminalStates.has(job.status)) {
      clearTimeout(pollTimer);
      pollJob();
    }
  });

  downloadButtons.forEach((button) => {
    button.addEventListener("click", () => {
      if (!latestJob) return;
      const format = button.dataset.format;
      const content = latestJob[format] || "";
      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `transcript.${format}`;
      link.click();
      URL.revokeObjectURL(link.href);
    });
  });
</script>
</body>
</html>
